name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend - compile and package
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - name: Frontend - install and build
        working-directory: frontend
        run: |
          npm install --force
          npm run build

  publish:
    # Runs only if "build" succeeded, and never for pull requests.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: docker.io/${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build backend JAR
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images (sha + latest tags)
        run: |
          TAG=sha-${GITHUB_SHA::7}
          for svc in frontend backend; do
            docker build -t $IMAGE_PREFIX/fullstack-$svc:$TAG -t $IMAGE_PREFIX/fullstack-$svc:latest ./$svc
            docker push --all-tags $IMAGE_PREFIX/fullstack-$svc
          done
