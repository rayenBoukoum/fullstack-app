services:
  frontend:
    build: ./frontend
    # On the VM (CD), images come from the registry: docker compose pull && up -d --no-build
    image: ${IMAGE_PREFIX:-local}/fullstack-frontend:${IMAGE_TAG:-latest}
    ports: ["4200:80"]
    depends_on: [backend]
    networks: [app-network]

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-local}/fullstack-backend:${IMAGE_TAG:-latest}
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/demo
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://${HOST_IP:-localhost}:4200
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-network]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

networks:
  app-network:
    driver: bridge
volumes:
  mysql-data:
